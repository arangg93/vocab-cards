<!doctype html>
<!-- 영어 단어 사진 카드 웹앱(html 한 개): 학습, 시험, 오답 노트, 내 단어장, 사진 바꾸기 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>교육부 필수 영어 단어 암기하기</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --sub:#5b6478; --line:#e2e6ef;
  --pri:#2f6fed; --pri2:#e8f0ff; --ok:#1f9d55; --okbg:#e6f6ec; --bad:#d64545; --badbg:#fdeaea;
  --warn:#b7791f; --warnbg:#fff6e0; --shadow:0 2px 10px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151d; --card:#1b212c; --ink:#e9edf5; --sub:#a3acbf; --line:#2c3443;
    --pri:#6b9bff; --pri2:#1f2b45; --ok:#4cc985; --okbg:#173326; --bad:#ff7b7b; --badbg:#3a1c1f;
    --warn:#f0b85a; --warnbg:#3a2f17; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%;}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:12px 16px 24px}
header.top{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
header.top h1{font-size:20px;margin:0;flex:1;line-height:1.3}
.back{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:12px;width:40px;height:40px;font-size:18px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
h2{font-size:17px;margin:18px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;
  padding:12px 14px;background:var(--pri2);color:var(--pri);font-weight:700;min-height:46px;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setbtn{border:none;text-align:left;background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  padding:12px;display:flex;gap:10px;align-items:center;min-height:62px}
.setbtn .em{font-size:26px;width:34px;text-align:center}
.setbtn b{display:block;font-size:15px}
.setbtn span{font-size:12.5px;color:var(--sub)}
.big .setbtn{min-height:72px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--pri2);color:var(--pri);font-weight:700}
.pill.l1{background:#e5f7ec;color:#18794e}.pill.l2{background:#e8f0ff;color:#2f5fcf}.pill.l3{background:#f4eaff;color:#7a3fc4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.l1{background:#173326;color:#6fe0a0}
 :root:not([data-theme="light"]) .pill.l2{background:#1f2b45;color:#8fb4ff}:root:not([data-theme="light"]) .pill.l3{background:#2d2140;color:#c9a2ff}}
input[type=text],input[type=url],input[type=search],select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);font-size:16px}
textarea{min-height:110px}
label.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
/* 단어 카드 */
.wcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;user-select:none;-webkit-user-select:none}
.photo{position:relative;width:100%;aspect-ratio:4/3;background:#eef1f7;display:flex;align-items:center;justify-content:center;overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .photo{background:#232a37}}
.photo img{width:100%;height:100%;object-fit:contain}
.photo .emo{font-size:110px;line-height:1}
.scene{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.scene .sc{font-size:76px;line-height:1.1;letter-spacing:8px;text-align:center;padding:0 10px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.scene .sc.sm{font-size:26px;letter-spacing:0;padding:0}
.ex{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--bg);text-align:left;font-size:16.5px;line-height:1.5}
.ex .hl{color:var(--pri)}
.ex .exk{color:var(--sub);font-size:14.5px;margin-top:2px}
.ex button{border:none;background:var(--pri2);color:var(--pri);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700;margin-left:4px}
.photo .credit{position:absolute;right:6px;bottom:6px;font-size:10.5px;background:rgba(0,0,0,.45);color:#fff;padding:2px 6px;border-radius:6px}
.photo .nophoto{position:absolute;left:8px;bottom:8px;font-size:11.5px;background:rgba(0,0,0,.45);color:#fff;padding:2px 7px;border-radius:6px}
.wbody{padding:14px 16px 16px;text-align:center}
.wword{font-size:34px;font-weight:800;letter-spacing:.5px;word-break:break-word}
.wpos{color:var(--sub);font-size:14px;margin-top:2px}
.wmean{margin-top:12px;font-size:21px;font-weight:700;min-height:32px}
.wmean.hide{color:var(--sub);font-weight:500;font-size:15px;border:1px dashed var(--line);border-radius:12px;padding:10px}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tools .btn{min-height:40px;padding:8px 12px;font-size:14px}
.navrow{display:flex;gap:10px;margin-top:12px}
.navrow .btn{flex:1;font-size:18px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--pri)}
/* 시험 */
.q{font-size:30px;font-weight:800;text-align:center;margin:8px 0 4px;word-break:break-word}
.qsub{text-align:center;color:var(--sub);margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;text-align:left;font-size:17px;font-weight:600;display:flex;gap:10px}
.opt .n{color:var(--sub);font-weight:800;width:20px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.blanks{font-family:ui-monospace,Consolas,monospace;letter-spacing:4px;text-align:center;color:var(--sub);margin:6px 0}
/* 목록 */
.wl{display:flex;flex-direction:column;gap:6px}
.wi{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.wi .th{width:52px;height:40px;border-radius:8px;background:#eef1f7;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wi .th{background:#232a37}}
.wi .th img{width:100%;height:100%;object-fit:cover}
.wi .tx{flex:1;min-width:0}
.wi .tx b{font-size:16px}
.wi .tx div{font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi .act{border:none;background:var(--pri2);color:var(--pri);border-radius:10px;min-width:40px;height:38px;font-weight:800}
.wi .act.del{background:var(--badbg);color:var(--bad)}
/* 아래 메뉴 */
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bot button{flex:1;border:none;background:none;padding:8px 0 9px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button .i{font-size:21px}
nav.bot button.on{color:var(--pri);font-weight:800}
/* 창 */
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:4px 0 12px;font-size:18px;display:flex;align-items:center}
.sheet h3 span{flex:1}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid button{border:2px solid transparent;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#ddd}
.pgrid button img{width:100%;height:100%;object-fit:cover}
.wi.on{outline:2px solid var(--pri);background:var(--pri2)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px}
.wi.on .ck{background:var(--pri);border-color:var(--pri)}
.alpha{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px;display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.alpha button{border:none;border-radius:8px;padding:7px 0;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:15px;position:relative}
.alpha button.on{background:var(--pri);color:#fff}
.alpha button i{position:absolute;top:-4px;right:-3px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;font-style:normal;padding:0 4px}
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:19;display:flex;justify-content:center;pointer-events:none}
.selbar>div{pointer-events:auto;width:calc(100% - 24px);max-width:536px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.selbar b{flex:1}
.guide{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:8px}
.guide pre{margin:4px 0;padding:8px 10px;background:var(--card);border:1px dashed var(--line);border-radius:8px;font-size:14px;white-space:pre-wrap;font-family:inherit}
.ptag{font-size:11.5px;padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:700}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sizes button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;font-weight:800;font-size:15px;color:var(--ink)}
.sizes button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.partrow{display:flex;gap:8px;align-items:center}.partrow select{flex:1;min-width:0}
.donebox{flex:none;display:flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer;background:var(--card)}
.donebox input{width:20px;height:20px;margin:0;accent-color:var(--ok)}
.donebox.on{border-color:var(--ok);color:var(--ok)}
.prog{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.kbar{display:block;height:5px;border-radius:3px;background:var(--line);margin:6px 0 3px;overflow:hidden;max-width:220px}
.kbar i{display:block;height:100%;background:var(--ok)}
.navrow .btn.ok{flex:1.2}
.easy{font-size:16px;line-height:1.75}
.easy h4{margin-top:18px}
.easy li{margin:3px 0}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2433;color:#fff;
  padding:10px 16px;border-radius:12px;z-index:60;font-size:14.5px;max-width:90vw;text-align:center}
.help h4{margin:14px 0 6px;font-size:16px}
.help p,.help li{line-height:1.65;font-size:15px}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.step{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.step .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:none;border-radius:10px;padding:10px;background:var(--card);box-shadow:var(--shadow);font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--pri);color:#fff}
.center{text-align:center}
.score{font-size:46px;font-weight:900;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<nav class="bot" id="nav">
  <button data-go="home"><span class="i">🏠</span>처음</button>
  <button data-go="wrong"><span class="i">📕</span>오답 노트</button>
  <button data-go="lists"><span class="i">⭐</span>내 단어장</button>
  <button data-go="help"><span class="i">❓</span>사용법</button>
</nav>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept=".json,application/json" hidden>
<script>
/* ===== 단어 자료 (교육부 2022 개정 영어과 기본 어휘 3,000개) =====

  r.onupgradeneeded=()=>r.result.createObjectStore('photos');
  r.onsuccess=()=>{idb=r.result;res();}; r.onerror=()=>res();}catch(e){res();}});}
function idbAll(){return new Promise(res=>{if(!idb)return res({});const out={};try{const tx=idb.transaction('photos');const st=tx.objectStore('photos');
  const c=st.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};c.onerror=()=>res(out);}catch(e){res(out);}});}
function idbPut(k,v){return new Promise(res=>{if(!idb){return res();}try{const tx=idb.transaction('photos','readwrite');
  v===null?tx.objectStore('photos').delete(k):tx.objectStore('photos').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});}
async function setPhoto(w,v){ if(v===null) delete PH[w]; else PH[w]=v; await idbPut(w,v); }

/* ===== 공통 도우미 ===== */
const $=s=>document.querySelector(s);
const jsq=s=>esc(JSON.stringify(String(s)));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function entry(w){const k=String(w).toLowerCase();if(BYW[k])return BYW[k];const c=CUSTOM[w]||CUSTOM[k];
  return c?{w,lv:0,pos:c.pos||'',ko:c.ko||'(뜻을 넣어 주세요)',noko:!c.ko,cat:'',em:c.em||'📘',img:'',alt:[],der:'',custom:true}:{w,lv:0,pos:'',ko:'(뜻을 넣어 주세요)',cat:'',em:'📘',img:'',alt:[],der:'',custom:true};}
function posKo(p){return (p||'').split('/').map(x=>POS[x]||x).filter(Boolean).join(', ');}
function photoOf(e){const c=PH[e.w];if(c==='none')return '';if(c)return c;return e.img;}
/* 사진이 없으면 예문 장면을 그림문자로 그린 그림 카드를 보여 준다 */
const CAT_BG={animal:'#ffe8c7,#ffd29a',plant:'#dff5d8,#b9e6a8',food:'#ffe1e1,#ffc4b0',body:'#ffe6f0,#ffc9dc',people:'#fdebd6,#f7cfa6',
  job:'#e3ecff,#c5d6ff',school:'#e6f4ff,#bfe0ff',home:'#f3ead9,#e6d2ad',clothes:'#f6e3ff,#e5c2fb',place:'#e0f0f5,#b7dbe6',transport:'#e4f0ff,#b8d4ff',
  weather:'#e2f4ff,#b3e1ff',time:'#f0ecff,#d6ccff',number:'#eef2f6,#d3dce6',color:'#fff3d6,#ffd9e8',sport:'#e2f7e9,#b4e8c6',art:'#fbe4ff,#eac0ff',
  feeling:'#fff0d9,#ffd6a8',action:'#e1f6f3,#aee6dc',describe:'#fff8d6,#ffe999',society:'#e9edf5,#c9d3e6',science:'#e0f3ff,#b8e3f5',
  talk:'#e8f2ff,#cfe0ff',function:'#eef0f4,#d7dbe4',abstract:'#f2ecff,#ddd0ff'};
function sceneHTML(e,small){const bg=CAT_BG[e.cat]||'#eef1f7,#dde3ef';const s=small?([...(e.sc||e.em)][0]||e.em):(e.sc||e.em);
  return `<div class="scene" style="background:linear-gradient(135deg,${bg})"><div class="sc ${small?'sm':''}">${esc(s)}</div></div>`;}
function imgFail(el){const e=entry(el.dataset.w);el.outerHTML=sceneHTML(e,el.dataset.sm==='1');}
function photoHTML(e,small){const src=photoOf(e);
  if(src) return `<img src="${esc(src)}" alt="${esc(e.w)} 사진" loading="lazy" referrerpolicy="no-referrer" data-w="${esc(e.w)}" data-sm="${small?1:0}" onerror="imgFail(this)">`;
  return sceneHTML(e,small);}
function exHTML(e){if(!e.ex)return '';const w=e.w.toLowerCase();const stem=w.length>4?w.slice(0,w.length-2):w.length>2?w.slice(0,w.length-1):w;
  const re=new RegExp('\\b('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','i');return esc(e.ex).replace(re,'<b class="hl">$1</b>');}
function speak(w){try{if(!('speechSynthesis' in window))return toast('이 기기는 소리 듣기를 지원하지 않아요.');speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=SET.rate||.85;speechSynthesis.speak(u);}catch(e){}}
/* 반복 듣기: 말 한 번이 끝날 때까지 기다리는 say, 정해진 횟수만큼 되풀이하는 repeatWord */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let SAY_ID=0;
function say(text,lang,id){return new Promise(res=>{if(!('speechSynthesis' in window)||id!==SAY_ID)return res();let done=false;const fin=()=>{if(!done){done=true;res();}};
  try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang.startsWith('ko')?1:(SET.rate||.85);u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);}catch(e){fin();}
  setTimeout(fin,4000+text.length*250);});}
function stopVoice(){SAY_ID++;try{speechSynthesis.cancel();}catch(e){}if(ST.auto){ST.auto=false;}}
function speakEx(w){const e=entry(w);if(!e.ex)return;stopVoice();say(e.ex,'en-US',SAY_ID);}
async function repeatWord(w){if(!('speechSynthesis' in window))return toast('이 기기는 소리 듣기를 지원하지 않아요.');
  stopVoice();const id=SAY_ID;const n=SET.rep||3;
  for(let k=0;k<n&&id===SAY_ID;k++){await say(w,'en-US',id);if(k<n-1)await sleep(600);}}
async function autoListen(){if(!('speechSynthesis' in window))return toast('이 기기는 소리 듣기를 지원하지 않아요.');
  stopVoice();const id=SAY_ID;ST.auto=true;render();
  while(id===SAY_ID&&ST.view==='study'){const w=ST.words[ST.i];const e=entry(w);ST.flip=false;render();
    for(let k=0;k<(SET.rep||3)&&id===SAY_ID;k++){await say(e.w,'en-US',id);await sleep(600);}
    if(id!==SAY_ID)break;ST.flip=true;render();
    if(SET.readKo!==false){await say(e.ko,'ko-KR',id);}
    if(SET.readEx!==false&&e.ex&&id===SAY_ID){await sleep(400);await say(e.ex,'en-US',id);}
    await sleep(900);if(id!==SAY_ID)break;
    if(ST.i<ST.words.length-1)ST.i++;else if(SET.loop){ST.i=0;}else{ST.auto=false;render();toast('끝까지 다 들었어요 🎧');return;}}
}

/* ===== 단어 묶음 ===== */
function setInfo(id){
  if(id==='all') return {name:'기본 어휘 전체',em:'📚',words:DB.map(e=>e.w)};
  if(id.startsWith('lv:')){const l=+id.slice(3);return {name:LV[l].name+' '+DB.filter(e=>e.lv===l).length.toLocaleString()+'단어',em:LV[l].em,words:DB.filter(e=>e.lv===l).map(e=>e.w)};}
  if(id.startsWith('cat:')){const c=id.slice(4);return {name:CATS[c][0],em:CATS[c][1],words:DB.filter(e=>e.cat===c).sort((a,b)=>a.lv-b.lv||a.i-b.i).map(e=>e.w)};}
  if(id.startsWith('list:')){const L=LISTS.find(x=>x.id===id.slice(5));return L?{name:L.name,em:'⭐',words:L.words.slice(),list:L}:{name:'(지워진 단어장)',em:'⭐',words:[]};}
  if(id==='custom') return {name:'추가 단어집',em:'➕',words:Object.keys(CUSTOM).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))};
  if(id==='known') return {name:'외운 단어',em:'✅',words:Object.keys(KNOWN).sort((a,b)=>KNOWN[b]-KNOWN[a])};
  if(id==='wrong') return {name:'오답 노트',em:'📕',words:Object.keys(WRONG).sort((a,b)=>WRONG[b].n-WRONG[a].n)};
  return {name:'?',em:'',words:[]};
}
const PART=30;
/* part 는 'all' 또는 '한번에몇개:몇일차'(예 '20:3'). 옛 기록의 숫자만 있는 값은 30개씩으로 본다 */
function partSplit(part){const t=String(part).split(':');return t.length>1?[+t[0],+t[1]]:[PART,+t[0]];}
function partWords(words,part){ if(!part||part==='all')return words; const [z,p]=partSplit(part); return words.slice((p-1)*z,p*z); }
function partLabel(part){if(!part||part==='all')return '';const [z,p]=partSplit(part);return ` ${p}일차`;}
/* 진도: 묶음마다 끝낸 일차를 기억한다 */
let DONE=LS.get('done',{});
/* 외운 단어: 카드에서 「외웠어요」를 누르면 쌓이고, 카드 공부에서는 건너뛴다. 시험에서 틀리면 빠진다 */
let KNOWN=LS.get('known',{});
const saveKnown=()=>LS.set('known',KNOWN);
function knownCount(words){let k=0;for(const w of words)if(KNOWN[w])k++;return k;}
function kbar(words){const n=words.length,k=knownCount(words);return `<span class="kbar"><i style="width:${n?Math.round(k/n*100):0}%"></i></span><span>외움 ${k.toLocaleString()} / ${n.toLocaleString()}</span>`;}
function markKnown(w){KNOWN[w]=Date.now();saveKnown();if(WRONG[w]){delete WRONG[w];saveWrong();}
  if(ST.single){toast('✅ 외운 단어에 넣었어요');return render();}
  const wasLast=ST.i>=ST.words.length-1;ST.words=ST.words.filter(x=>x!==w);ST.flip=false;ST.lastSpoken=null;
  let msg='✅ 외웠어요! 다시 안 나와요';
  try{const b=JSON.parse(ST.back||'null');if(b&&b.id&&b.part&&b.part!=='all'&&b.id!=='wrong'&&b.id!=='known'){const S=setInfo(b.id);const P=partWords(S.words,b.part);
    if(P.length&&P.every(x=>KNOWN[x])&&!isDone(b.id,b.part)){DONE[b.id]=DONE[b.id]||{};DONE[b.id][b.part]=1;LS.set('done',DONE);msg='🏆 이 일차 단어를 다 외웠어요! 완료로 표시했어요';}}}catch(e){}
  toast(msg);
  if(wasLast&&ST.words.length){toast(msg+' · 다 봤어요!');return goBack();}
  if(!ST.words.length){const b=JSON.parse(ST.back||'{"view":"home"}');if(b.part&&b.part!=='all'&&isDone(b.id,b.part))delete b.part;go(b.view||'home',b);return;}
  ST.i=Math.min(ST.i,ST.words.length-1);render();}
function unKnown(w){delete KNOWN[w];saveKnown();toast('다시 공부할 단어로 돌려놨어요');render();}
function isDone(id,part){return !!(DONE[id]&&DONE[id][part]);}
function toggleDone(id,part,on){DONE[id]=DONE[id]||{};if(on)DONE[id][part]=1;else delete DONE[id][part];LS.set('done',DONE);render();if(on)toast('✅ 완료로 표시했어요');}
const SIZES=[10,20,30,50];
function setSize(z){SET.size=+z;saveSet();ST.part=null;render();}

/* ===== 화면 이동 ===== */
let ST = {view:'home'};
function go(view,opt){stopVoice();ST=Object.assign({view},opt||{});window.scrollTo(0,0);render();
  try{history.replaceState(null,'','#'+view);}catch(e){} }
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.go);});
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===ST.view||(ST.view==='listEdit'&&b.dataset.go==='lists')||(ST.view==='browse'&&b.dataset.go==='home')));
  const v=VIEWS[ST.view]||VIEWS.home; $('#app').innerHTML=v(); if(v.after)v.after();
}
function topBar(title,backTo){return `<header class="top">${backTo?`<button class="back" onclick="${backTo}" aria-label="뒤로">←</button>`:''}<h1>${title}</h1></header>`;}

/* ---- 단어 묶음 화면 ---- */
VIEWS.set=()=>{
  const S=setInfo(ST.id); const n=S.words.length; const z=SET.size||PART;
  const partOk=k=>isDone(ST.id,k)||(ST.id!=='wrong'&&ST.id!=='known'&&partWords(S.words,k).every(w=>KNOWN[w]));
  if(ST.part&&ST.part!=='all'&&!String(ST.part).includes(':'))ST.part=PART+':'+ST.part;
  if(!ST.part||(ST.part==='all'?n>z:(partSplit(ST.part)[0]!==z||partSplit(ST.part)[1]>Math.ceil(n/z)))){let p=1;const m=Math.ceil(n/z);while(p<m&&partOk(z+':'+p))p++;ST.part=n>z?z+':'+p:'all';}
  const part=ST.part;
  let h=topBar(`${S.em} ${esc(S.name)}`,"go('home')");
  if(!n) return h+`<div class="card center muted">${ST.id==='wrong'?'오답 노트가 비어 있어요. 시험에서 틀린 단어가 여기에 모여요. 🎉':'아직 단어가 없어요.'}</div>`+(S.list?`<button class="btn pri block" onclick="go('listEdit',{id:'${S.list.id}'})">단어 넣으러 가기</button>`:'');
  if(n>SIZES[0]){const m=Math.ceil(n/z);const dn=Array.from({length:m},(_,k)=>partOk(z+':'+(k+1))).filter(Boolean).length;
    h+=`<div class="card"><div style="font-weight:800;margin-bottom:6px">① 한 번에 공부할 양을 고르세요</div>
    <div class="sizes">${SIZES.map(x=>`<button class="${x===z?'on':''}" onclick="setSize(${x})">${x}개</button>`).join('')}</div>`;
    if(n>z){h+=`<div style="font-weight:800;margin:12px 0 6px">② 오늘 할 일차 <span class="muted small" style="font-weight:400">(완료 ${dn} / ${m}일차)</span></div>
    <div class="partrow"><select onchange="ST.part=this.value;render()">`;
    for(let p=1;p<=m;p++){const a=(p-1)*z+1,b=Math.min(p*z,n),k=z+':'+p;h+=`<option value="${k}" ${part===k?'selected':''}>${partOk(k)?'✅ ':''}${p}일차 (${a}~${b}번)</option>`;}
    h+=`</select>`;
    if(part!=='all'&&ST.id!=='wrong')h+=`<label class="donebox ${isDone(ST.id,part)?'on':''}"><input type="checkbox" ${isDone(ST.id,part)?'checked':''} onchange="toggleDone('${ST.id}','${part}',this.checked)">완료</label>`;
    h+=`</div>${ST.id==='wrong'?'':`<div class="prog"><i style="width:${Math.round(dn/m*100)}%"></i></div>`}`;}
    h+=`</div>`;}
  const W=partWords(S.words,part);
  const kn=ST.id==='known'?0:knownCount(W), left=W.length-kn;
  h+=`<div class="card"><div class="muted" style="margin-bottom:10px">고른 단어 <b style="color:var(--ink)">${W.length}개</b>${ST.id==='known'?'':` · 외움 <b style="color:var(--ok)">${kn}개</b> · 남은 단어 <b style="color:var(--ink)">${left}개</b>`}</div>
    ${ST.id==='known'||left?`<button class="btn pri block" style="margin-bottom:8px;font-size:17px" onclick="startStudy()">🃏 카드로 공부하기${ST.id==='known'?'':` (남은 ${left}개)`}</button>`:`<div class="card center" style="background:var(--okbg);margin:0 0 8px"><b>🏆 여기 단어는 다 외웠어요!</b><div class="muted small">시험으로 확인해 보세요</div></div>`}
    ${kn?`<button class="btn ghost block" style="margin-bottom:8px" onclick="startStudy(true)">🔁 외운 단어까지 모두 다시 보기</button>`:''}
    <div class="row"><button class="btn ok" onclick="go('testSetup',{id:ST.id,part:ST.part||'all'})" style="font-size:17px">📝 시험 보기</button></div></div>`;
  if(ST.id==='wrong') h+=`<button class="btn bad block" style="margin-bottom:12px" onclick="if(confirm('오답 노트를 모두 비울까요?')){WRONG={};saveWrong();go('home')}">오답 노트 모두 비우기</button>`;
  if(S.list) h+=`<button class="btn ghost block" style="margin-bottom:12px" onclick="go('listEdit',{id:'${S.list.id}'})">✏️ 이 단어장 고치기 (단어 넣기, 빼기)</button>`;
  if(ST.id==='custom'){const nk=W.filter(w=>!CUSTOM[w].ko).length;

  return h;
};

   <div class="card" style="margin-top:12px"><label class="chk"><input type="checkbox" ${SET.showMean?'checked':''} onchange="SET.showMean=this.checked;saveSet();render()"> 뜻 처음부터 보이기</label>
   <label class="chk"><input type="checkbox" ${SET.shuffle?'checked':''} onchange="SET.shuffle=this.checked;saveSet();toast('다음에 공부를 시작할 때부터 적용돼요')"> 순서 섞어서 공부하기</label>
   <label class="chk"><input type="checkbox" ${SET.autoSpeak?'checked':''} onchange="SET.autoSpeak=this.checked;saveSet()"> 카드 넘길 때 소리 자동 듣기</label>

VIEWS.study.after=()=>{const wc=$('#wc');if(!wc||ST.single)return;let x0=null;

function nextCard(){if(ST.i<ST.words.length-1){ST.i++;ST.flip=false;render();}else{toast('다 봤어요! 이제 시험으로 확인해 볼까요? 💪');goBack();}}

/* ---- 시험 준비 ---- */
VIEWS.testSetup=()=>{
  const S=setInfo(ST.id);const W=partWords(S.words,ST.part||'all');
  let h=topBar('📝 시험 보기',`go('set',{id:'${ST.id}',part:'${ST.part||'all'}'})`);
  h+=`<div class="card"><b>${esc(S.name)}</b> <span class="muted">· ${W.length}문제</span><div class="muted small" style="margin-top:4px">모든 단어가 한 번씩, 순서를 섞어서 나와요. 중간에 그만둬도 이어서 풀 수 있어요.</div></div>
  <h2>어떤 방식으로 볼까요?</h2><div style="display:flex;flex-direction:column;gap:8px">
  <button class="setbtn" onclick="startTest('mc_en')"><span class="em">🔤</span><div><b>5지선다: 영어 보고 뜻 고르기</b><span>가장 쉬워요. 처음엔 이걸로!</span></div></button>
  <button class="setbtn" onclick="startTest('mc_ko')"><span class="em">🖼</span><div><b>5지선다: 사진과 뜻 보고 영어 고르기</b><span>보통</span></div></button>
  <button class="setbtn" onclick="startTest('write')"><span class="em">✏️</span><div><b>주관식: 영어 철자 직접 쓰기</b><span>어려워요. 철자까지 외웠는지 확인해요.</span></div></button></div>`;
  const nko=W.filter(w=>entry(w).noko).length;
  if(nko) h+=`<div class="card small" style="margin-top:12px;background:var(--badbg);color:var(--bad)">뜻이 비어 있는 단어가 ${nko}개 있어요. 처음 화면의 <b>➕ 추가 단어집</b>에서 뜻을 넣으면 시험이 더 정확해져요.</div>`;
  if(W.length<5) h+=`<div class="card muted small" style="margin-top:12px">단어가 5개보다 적으면 보기는 다른 기본 단어에서 가져와요.</div>`;
  return h;
};
const MODE={mc_en:'영어 → 뜻 고르기',mc_ko:'뜻 → 영어 고르기',write:'철자 쓰기'};
function startTest(mode){const S=setInfo(ST.id);const W=shuffle(partWords(S.words,ST.part||'all'));
  const T={setId:ST.id,part:ST.part||'all',name:S.name+partLabel(ST.part),mode,words:W,i:0,right:[],wrong:[],review:ST.id==='wrong'};
  LS.set('test',T);go('test',{T});}
function resumeTest(){const T=LS.get('test',null);if(T)go('test',{T});}
function makeOptions(e,T){
  const pool0=T.words.map(entry), key=T.mode==='mc_en'?'ko':'w';
  const firstPos=(e.pos||'').split('/')[0];
  const used=new Set([e[key]]); const out=[];
  const tryPool=(pool,samePos)=>{for(const c of shuffle(pool)){if(out.length>=4)break;if(c.w===e.w||used.has(c[key])||!c[key]||c[key].startsWith('('))continue;
      if(samePos&&firstPos&&(c.pos||'').split('/')[0]!==firstPos)continue;used.add(c[key]);out.push(c);}};
  tryPool(pool0,true);tryPool(pool0,false);tryPool(DB.filter(c=>c.lv===(e.lv||1)),true);tryPool(DB,false);
  return shuffle([e,...out]);
}
VIEWS.test=()=>{
  const T=ST.T; if(T.i>=T.words.length) return testResult();
  const e=entry(T.words[T.i]);
  if(ST.optFor!==T.i){ST.opts=T.mode==='write'?null:makeOptions(e,T).map(x=>x.w);ST.optFor=T.i;ST.ans=null;}
  let h=topBar(`📝 ${T.i+1} / ${T.words.length}`,"if(confirm('시험을 잠깐 멈출까요? 처음 화면에서 이어서 풀 수 있어요.'))go('home')");
  h+=`<div class="progress"><i style="width:${T.i/T.words.length*100}%"></i></div><div class="muted small center" style="margin-bottom:8px">${esc(T.name)} · ${MODE[T.mode]} · 맞음 ${T.right.length} · 틀림 ${T.wrong.length}</div>`;
  const answered=ST.ans!==null&&ST.ans!==undefined;
  if(T.mode==='mc_en'){
    h+=`<div class="card"><div class="q">${esc(e.w)}</div><div class="qsub">${esc(posKo(e.pos))} <button class="btn" style="min-height:34px;padding:4px 10px" onclick="speak(${jsq(e.w)})">🔊</button></div>
      ${answered?`<div class="photo" style="border-radius:12px">${photoHTML(e)}</div>`:''}</div>`;
  } else {
    h+=`<div class="wcard" style="margin-bottom:12px"><div class="photo">${photoHTML(e)}</div><div class="wbody"><div style="font-size:22px;font-weight:800">${esc(e.ko)}</div><div class="wpos">${esc(posKo(e.pos))}</div>
      ${T.mode==='write'&&!answered?`<div class="blanks">${e.w.split('').map(c=>c===' '?'&nbsp;':'_').join(' ')}</div><div class="muted small">${e.w.replace(/ /g,'').length}글자${ST.hint?` · 첫 글자 <b>${esc(e.w[0])}</b>`:''}</div>`:''}</div></div>`;
  }
  if(T.mode==='write'){
    if(!answered) h+=`<div class="card"><input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 써 보세요" onkeydown="if(event.key==='Enter')checkWrite()">
      <div class="row" style="margin-top:8px"><button class="btn pri" onclick="checkWrite()">확인</button><button class="btn ghost" onclick="ST.hint=true;render()">💡 힌트</button><button class="btn ghost" onclick="answer(false,'')">모르겠어요</button></div></div>`;
  } else {
    h+=`<div class="opts">`+ST.opts.map((w,k)=>{const o=entry(w);const lab=T.mode==='mc_en'?o.ko:o.w;let cls='';
      if(answered){if(w===e.w)cls='right';else if(w===ST.ans)cls='wrong';}
      return `<button class="opt ${cls}" ${answered?'disabled':''} onclick="pickOpt(${jsq(w)})"><span class="n">${k+1}</span><span>${esc(lab)}</span></button>`;}).join('')+`</div>`;
  }
  if(answered){const ok=ST.ans===e.w||ST.okWrite;
    h+=`<div class="fb ${ok?'ok':'bad'}">${ok?'⭕ 정답이에요!':'❌ 아쉬워요. 오답 노트에 넣어 둘게요.'}<div style="color:var(--ink);font-weight:600;margin-top:4px">${esc(e.w)} = ${esc(e.ko)}</div>
      ${!ok&&T.mode==='write'&&ST.typed?`<div class="muted small">내가 쓴 답: ${esc(ST.typed)}</div>`:''}${ok&&T.review?'<div class="small" style="margin-top:4px">오답 노트에서 빠졌어요 👍</div>':''}
      ${e.ex?`<div class="ex" style="font-weight:500;color:var(--ink)">📖 ${exHTML(e)}<div class="exk">${esc(e.exk)}</div></div>`:''}</div>
      <button class="btn pri block" id="nextBtn" style="margin-top:10px;font-size:18px" onclick="nextQ()">${T.i===T.words.length-1?'결과 보기':'다음 문제 ▶'}</button>`;}
  return h;
};
VIEWS.test.after=()=>{const a=$('#ans');if(a)a.focus();const n=$('#nextBtn');if(n)n.focus();};
document.addEventListener('keydown',e=>{if(ST.view!=='test'||ST.ans!==null&&ST.ans!==undefined)return;if(document.activeElement&&document.activeElement.id==='ans')return;
  const k=+e.key;if(k>=1&&k<=5&&ST.opts&&ST.opts[k-1])pickOpt(ST.opts[k-1]);});
function pickOpt(w){answer(w===entry(ST.T.words[ST.T.i]).w,w);}
function norm(s){return String(s).toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim();}
function checkWrite(){const v=$('#ans').value;if(!v.trim())return toast('답을 써 주세요');const e=entry(ST.T.words[ST.T.i]);
  const ok=[e.w,...e.alt].some(x=>norm(x)===norm(v));ST.typed=v;answer(ok,ok?e.w:v);}
function answer(ok,ans){const T=ST.T;const w=T.words[T.i];ST.ans=ans;ST.okWrite=ok;
  if(ok){T.right.push(w);if(T.review){delete WRONG[w];saveWrong();}}
  else{T.wrong.push(w);if(KNOWN[w]){delete KNOWN[w];saveKnown();}WRONG[w]={n:((WRONG[w]||{}).n||0)+1,t:Date.now()};saveWrong();}
  LS.set('test',Object.assign({},T,{i:T.i+1}));render();}
function nextQ(){ST.T.i++;ST.ans=null;ST.typed='';ST.hint=false;ST.okWrite=false;if(ST.T.i>=ST.T.words.length)LS.set('test',null);render();}
function testResult(){const T=ST.T;const n=T.words.length,r=T.right.length;const pct=n?Math.round(r/n*100):0;
  let h=topBar('🏁 시험 결과',"go('home')")+`<div class="card center"><div class="muted">${esc(T.name)} · ${MODE[T.mode]}</div><div class="score">${r} / ${n}</div>
   <div style="font-size:18px;font-weight:700">${pct}점 ${pct===100?'🏆 완벽해요!':pct>=80?'👏 아주 잘했어요!':pct>=50?'💪 조금만 더!':'🌱 다시 해 보면 쑥쑥 늘어요!'}</div></div>`;
  if(T.wrong.length){h+=`<div class="row" style="margin-bottom:8px"><button class="btn bad" onclick="retryWrong('test')">❌ 틀린 ${T.wrong.length}개만 다시 시험</button></div>
    <button class="btn pri block" style="margin-bottom:12px" onclick="retryWrong('study')">🃏 틀린 단어 카드로 공부하기</button>
    <h2>틀린 단어</h2><div class="wl">${T.wrong.map(w=>wordRow(entry(w))).join('')}</div>`;}
  if(!T.review&&T.part&&T.part!=='all'){if(!String(T.part).includes(':'))T.part=PART+':'+T.part;const on=isDone(T.setId,T.part);
    h+=`<button class="btn ${on?'ghost':'ok'} block" style="margin-top:12px" onclick="toggleDone('${T.setId}','${T.part}',${!on})">${on?'✅ 이 일차는 완료로 표시됨 (누르면 풀기)':'✅ 이 일차를 완료로 표시하기'}</button>
    <button class="btn ghost block" style="margin-top:8px" onclick="go('set',{id:'${T.setId}'})">일차 목록으로 가기</button>`;}
  h+=`<button class="btn ghost block" style="margin-top:12px" onclick="go('home')">처음으로</button>`;

async function addWord(L,raw,ko,noPhoto){
  let w=String(raw).trim().replace(/\s+/g,' ');if(!w)return 'skip';
  const hit=BYW[w.toLowerCase()];
  if(hit){w=hit.w;}else{
    if(!/^[A-Za-z][A-Za-z '\-.]*$/.test(w))return 'bad';
    const prev=CUSTOM[w];
    CUSTOM[w]={ko:ko||(prev&&prev.ko)||'',pos:(prev&&prev.pos)||'',em:(prev&&prev.em)||'📘'};saveCustom();
    if(!PH[w]&&!noPhoto){const u=await wikiPhoto(w);if(u)await setPhoto(w,u);}
  }
  if(L.words.includes(w))return 'dup';L.words.push(w);saveLists();return hit?'ok':'new';
}

/* 붙여넣은 목록 읽기
   - 한 줄에 「단어」 하나, 또는 「단어, 뜻」(쉼표, 탭, 콜론, 등호, 띄어쓴 하이픈, 그냥 띄어쓰기로 뜻과 나눔)
   - 한글이 없는 줄은 쉼표, 탭, 세미콜론, 빗금으로 여러 단어를 나눠 적어도 된다
   - 줄 앞 번호(1. 2) ③ 등)는 무시한다 */
function parseWordList(text){const out=[];
  for(let ln of String(text).split(/\r?\n/)){
    ln=ln.replace(/^\s*(?:[\(\[]?\d+[.)\]]|[①-⑳]|[-•*·▶○●□■]+)\s*/,'').trim();if(!ln)continue;
    if(/[가-힣]/.test(ln)){
      const m=ln.match(/^([A-Za-z][A-Za-z '\-.]*?)\s*(?:\t|,|=|:|\s-\s|\s(?=[가-힣(~]))\s*(.*[가-힣].*)$/);
      if(m)out.push({w:(w=>/\..*\.$/.test(w)?w:w.replace(/[.\-]+$/,''))(m[1].trim()),ko:m[2].trim()});
      else{const m2=ln.match(/^([A-Za-z][A-Za-z '\-.]*[A-Za-z'])\s*[-.|–—→\/>:=,~\s]*\s*([가-힣(].*)$/);
        out.push(m2?{w:m2[1].trim(),ko:m2[2].trim()}:{w:ln,ko:''});}}
    else ln.split(/[,\t;\/]+/).forEach(x=>{x=x.trim().replace(/^["'“”‘’]+|["'“”‘’.!?]+$/g,'');if(x)out.push({w:x,ko:''});});}
  return out;}
function classify(it){const raw=it.w.trim().replace(/\s+/g,' ');
  if(!/^[A-Za-z][A-Za-z '\-.]*$/.test(raw))return 'bad';
  if(BYW[raw.toLowerCase()])return 'base';
  if(it.ko||(CUSTOM[raw]&&CUSTOM[raw].ko))return 'neu';
  return 'noko';}

  <div>④ <b>엑셀이나 한글 표</b>에서 「영어 | 뜻」 두 칸을 복사해 붙여도 그대로 읽혀요. 줄 앞의 번호(1. 2. ①)는 저절로 빠져요.</div>

/* 미리 보기: 어떻게 읽혔는지 색으로 보여 준다 */
function previewPaste(src,dst){const items=parseWordList($('#'+src).value);const box=$('#'+dst);
  if(!items.length){box.innerHTML='<div class="muted small" style="margin-top:8px">붙여 넣은 단어가 없어요.</div>';return;}
  const tag={base:['기본 단어','#e5f7ec','#18794e'],neu:['새 단어, 뜻 있음','#e8f0ff','#2f5fcf'],noko:['새 단어, 뜻 없음','#fff6e0','#b7791f'],bad:['못 읽음','#fdeaea','#d64545']};
  const c={base:0,neu:0,noko:0,bad:0};
  const rows=items.map(it=>{const k=classify(it);c[k]++;const e=k==='base'?BYW[it.w.trim().toLowerCase()]:null;

async function addParsed(L,items){const R={base:[],neu:[],noko:[],dup:[],bad:[]};
  for(const it of items){const r=await addWord(L,it.w,it.ko,true);const hit=BYW[it.w.trim().toLowerCase()];const w=hit?hit.w:it.w.trim().replace(/\s+/g,' ');
    if(r==='ok')R.base.push(w);else if(r==='new'){R.neu.push(w);if(!CUSTOM[w].ko)R.noko.push(w);}else if(r==='dup')R.dup.push(w);else if(r==='bad')R.bad.push(it.w);}
  photosLater(R.neu);return R;}
async function photosLater(words){let n=0;for(const w of words){if(PH[w])continue;const u=await wikiPhoto(w);if(u){await setPhoto(w,u);n++;}}

function editCustom(w){const c=CUSTOM[w];if(!c)return;const v=prompt(`「${w}」의 뜻을 써 주세요`,c.ko||'');if(v===null)return;c.ko=v.trim();saveCustom();render();}

  delete CUSTOM[w];used.forEach(L=>L.words=L.words.filter(x=>x!==w));delete WRONG[w];saveCustom();saveLists();saveWrong();if(PH[w])await setPhoto(w,null);render();}

function newListWith(w){const n=($('#pickNew').value||'').trim();if(!n)return toast('새 단어장 이름을 써 주세요');

function useUrl(){const u=$('#phurl').value.trim();if(!/^https?:\/\//.test(u))return toast('https:// 로 시작하는 사진 주소를 넣어 주세요');
  const im=new Image();im.onload=()=>setPhotoDone(u);im.onerror=()=>toast('그 주소에서 사진을 못 불러왔어요. 사진 자체 주소(이미지 주소 복사)인지 확인해 주세요');im.referrerPolicy='no-referrer';im.src=u;}

function shrink(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
async function wikiPhoto(title){try{const u='https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages|pageprops&piprop=thumbnail&pithumbsize=500&ppprop=disambiguation&titles='+encodeURIComponent(title);
  const j=await (await fetch(u)).json();const p=(j.query.pages||[])[0];if(!p||p.missing||(p.pageprops&&'disambiguation' in p.pageprops)||!p.thumbnail)return '';return p.thumbnail.source;}catch(e){return '';}}
async function searchPhotos(){const q=$('#phq').value.trim();if(!q)return;const box=$('#phRes');box.innerHTML='찾는 중… ⏳';
  const out=[];
  const w=await wikiPhoto(q);if(w)out.push(w);
  try{const j=await (await fetch('https://api.openverse.org/v1/images/?page_size=12&mature=false&q='+encodeURIComponent(q))).json();(j.results||[]).forEach(r=>out.push(r.thumbnail||r.url));}catch(e){}
  try{const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url&iiurlwidth=400';
    const j=await (await fetch(u)).json();Object.values((j.query||{}).pages||{}).forEach(p=>{const ii=(p.imageinfo||[])[0];if(ii&&ii.thumburl)out.push(ii.thumburl);});}catch(e){}
  const uniq=[...new Set(out)].slice(0,24);
  if(!uniq.length){box.innerHTML='사진을 못 찾았어요. 다른 말로 찾거나(영어 추천), 직접 찍어서 올려 주세요. 학교 인터넷에서 막혀 있을 수도 있어요.';return;}
  box.innerHTML='<div style="margin-bottom:6px">마음에 드는 사진을 누르세요 👇</div><div class="pgrid">'+uniq.map(u=>`<button onclick="setPhotoDone(${jsq(u)})"><img src="${esc(u)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></button>`).join('')+'</div>';}

function backupAll(){const data={app:'vocab-photo-cards-backup',ver:1,wrong:WRONG,lists:LISTS,custom:CUSTOM,photos:PH,settings:SET,done:DONE,known:KNOWN};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='단어카드_백업_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);}
function restorePick(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='vocab-photo-cards-backup')throw 0;if(!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?'))return;
    WRONG=d.wrong||{};LISTS=d.lists||[];CUSTOM=d.custom||{};SET=d.settings||SET;DONE=d.done||{};KNOWN=d.known||{};saveKnown();LS.set('done',DONE);saveWrong();saveLists();saveCustom();saveSet();
    for(const [w,v] of Object.entries(d.photos||{}))await setPhoto(w,v);toast('되살렸어요');go('home');}catch(e){alert('이 앱의 백업 파일이 아니에요.');}};i.click();}
